# nnseg's test suite.
#
# Scope is deliberately `test_nnseg_*` + `kernel_test_*`: the rest of this repo is the MLX
# toolkit, whose core dependency (mlx) has no Linux wheels. That split is not a workaround -
# nnseg running where mlx does not is the point of the torch path, and tests/test_nnseg_layering
# enforces it. So this job also proves that property on every push.
name: tests

on:
  push:
    branches: [main, feature/nnseg]
  pull_request:
  workflow_dispatch:

jobs:
  nnseg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # uv.lock is not the dependency source here (see below), so key the cache on the
          # workflow itself - it invalidates exactly when the installed set changes.
          cache-dependency-glob: .github/workflows/tests.yml
      - name: Install dependencies
        # Not `uv sync`: that installs the package, whose core dependency is mlx. Install what
        # nnseg itself needs and put src on the path - the same recipe cuda/_common.py uses.
        # The CPU torch index avoids pulling ~2.5 GB of CUDA wheels for a CPU-only runner.
        # The second line is the serve/REST tier (fastapi..matplotlib) plus modal + pydicom:
        # without them the serve suite importorskips to nothing and CI proves less than it
        # appears to (found when unguarded fastapi imports failed the 2026-08-25 push).
        run: |
          uv venv
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch nnunetv2 scipy scikit-image 'SimpleITK>=2.3' pytest \
            fastapi httpx python-multipart matplotlib modal pydicom 'zarr>=3'
      - name: Run tests
        env:
          PYTHONPATH: src
        # --no-project is load-bearing: plain `uv run` re-syncs the project first, and
        # [tool.uv.sources] points nnunetv2 at ../upstream/nnUNet, a sibling checkout that
        # exists in the dev workspace but not in a CI clone.
        run: uv run --no-project pytest tests/test_nnseg_*.py tests/kernel_test_*.py tests/test_ranked_distance.py -m "not slow" -q
