[project]
name = "nnunet-inference-mlx"
version = "0.10.0"
description = "nnU-Net inference on Apple Silicon via MLX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tqdm",
    "typer>=0.12",
    # SITK is core: reading/writing images and spacing-aware resampling are
    # part of segmenting, which is what the package is for. `uv run` installs it.
    "SimpleITK",
]
# NOTE: mlx is NOT a core dependency (moved to the `mlx` extra below, 2026-08-26).
# The product is torch/MPS-first (nnseg); MLX is the oracle-only path. Keeping mlx
# in core made the whole package uninstallable where mlx has no wheels (Linux/CUDA/
# Modal) - CI had to avoid `uv sync` and hand-list deps for exactly this reason, and
# the per-engine images mount the package + hand-list rather than `pip install nnseg[...]`.
# With mlx optional, core installs anywhere and uv-native `uv sync --extra <x>` works.

[project.scripts]
nnmlx = "nnunet_inference_mlx.cli:app"
# TotalSegmentator-compatible CLI. Both names run the same drop-in front end;
# `TotalSegmentator` lets existing command lines work verbatim under `uv run`.
TotalSegmentator = "nnunet_inference_mlx.ts_cli:main"
totalseg-mlx = "nnunet_inference_mlx.ts_cli:main"
nnseg = "nnseg.cli:main"

[project.optional-dependencies]
# The MLX oracle path (the `nnunet_inference_mlx` package + the nnmlx / TotalSegmentator /
# totalseg-mlx scripts). Apple-Silicon only - mlx has no Linux/CUDA wheels, which is why it
# is an extra, not a core dep: `nnseg` (the torch product) never imports it (enforced by
# tests/test_nnseg_layering.py), so core stays installable everywhere. Run the oracle with
# `uv sync --extra mlx` (or `pip install nnunet-inference-mlx[mlx]`).
mlx = ["mlx>=0.25"]
# Remote weight download (store.download / download_archive).
remote = ["httpx"]
# The REST job server (nnseg serve).
serve = ["matplotlib", "fastapi", "uvicorn", "python-multipart"]
# Server-side fetch of IDC series by UUID (source kind "idc").
idc = ["obstore"]
# Deploying the server to Modal (nnseg modal deploy).
modal = ["modal"]
# Multi-label connected-component cleanup (segment --remove-small-components-mm3).
postprocessing = ["connected-components-3d"]
test = ["pytest", "pydicom", "fastapi", "httpx", "python-multipart"]
# The torch path (nnseg): torch >= 2.7 for torch.mps.compile_shader; nnunetv2 for the network
# architecture, weights and sliding-window slicers (stock APIs only - the GPU resampler now
# lives in nnseg.resample, so no fork is pinned); scipy builds the resampler's exact operators;
# scikit-image is test-only reference. SimpleITK is already a core dependency and does the IO.
# numpy>=2 anchors the "numpy-2 world" (the GPU/nnU-Net path, tested on 2.x) so it forks
# cleanly from the synthstrip engine's numpy<2 - see [tool.uv] conflicts below.
torch = ["torch>=2.7", "nnunetv2", "scipy", "scikit-image", "numpy>=2"]
# The SynthStrip engine (nnseg.engines.synthstrip): its OWN environment. surfa is SynthStrip's
# trained-input conform, and surfa's reorient needs numpy<2 - genuinely incompatible with the
# torch extra's numpy>=2. Declared conflicting below so uv forks them into ONE universal lock;
# materialize this engine on its own: `UV_PROJECT_ENVIRONMENT=.venvs/synthstrip uv sync --extra synthstrip`.
synthstrip = ["torch>=2.7", "surfa", "numpy<2", "scipy"]
# The FastSurfer engine, installed pip-style from our slimmed fork `fastsurfer-lean`
# (mhalle/fastsurfer-lean - FastSurfer's parcellation CNN only, packaging fixed so
# FastSurferCNN's subpackages ship; git rev in [tool.uv.sources]). This replaces the
# image's git-clone + requirements + sys.path hack with a proper install. Upstream
# FastSurfer itself can't be an extra: its `[tool.setuptools] packages` list omits
# subpackages, so a plain `pip install git+.../FastSurfer` is import-broken - hence
# the fork. Heavy tree dropped in the fork; conflicts with the other engines below.
fastsurfer = ["fastsurfer-lean"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnunet_inference_mlx", "src/nnseg"]

[tool.hatch.build.targets.wheel.force-include]
"src/nnunet_inference_mlx/data" = "nnunet_inference_mlx/data"

[tool.uv]
# Engines own their environments (docs: "one environment per engine"). An engine whose
# deps genuinely conflict with the core (here: synthstrip's numpy<2 vs the torch path's
# numpy>=2) is declared here so uv resolves them in separate forks of ONE universal lock -
# the same declaration then drives per-engine venvs locally and per-engine images on Modal.
# A future engine with its own incompatible pins adds an extra + one entry here.
conflicts = [
    [
      { extra = "torch" },
      { extra = "synthstrip" },
      { extra = "fastsurfer" },
    ],
]

[tool.uv.sources]
# Local convenience, not a pin: nnseg uses only stock nnunetv2 APIs, so a released nnunetv2
# works too. The checkout is here anyway for upstream work.
nnunetv2 = { path = "../upstream/nnUNet", editable = true }
# fastsurfer-lean = our slimmed FastSurfer fork (parcellation CNN only, packaging fixed).
# Pinned to the slim branch's rev; import namespace stays FastSurferCNN.
fastsurfer-lean = { git = "https://github.com/mhalle/fastsurfer-lean.git", rev = "041062008b1276b2fb21c886d6943f7bfc3bba6e" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy benchmarks (deselect with '-m not slow')"]
