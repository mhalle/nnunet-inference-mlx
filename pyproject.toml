[project]
name = "nnunet-inference-mlx"
version = "0.8.1"
description = "nnU-Net inference on Apple Silicon via MLX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.25",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
# Remote loading of .pth checkpoints over HTTP range requests.
remote = ["requests", "remotezip"]
# Spacing-aware resampling helpers + SITK-image I/O for predict_with_resampling.
preprocessing = ["SimpleITK"]
# Multi-label connected-component cleanup (remove_small_components).
postprocessing = ["connected-components-3d"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnunet_inference_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy benchmarks (deselect with '-m not slow')"]
